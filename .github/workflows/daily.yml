name: Daily Risk Pipeline

on:
  workflow_dispatch:
  schedule:
  - cron: "0 13 * * 1-5"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify environment (imports + model load)
        run: |
          python -c "import tensorflow as tf; import keras; print('TF', tf.__version__, 'Keras', keras.__version__)"
          python -c "import keras; m = keras.models.load_model('data/gru_regime_model.keras'); print('Model loaded OK')"
          python -c "import pickle; s = pickle.load(open('data/regime_scaler_X.pkl', 'rb')); print('Scaler loaded OK')"

      - name: Run pipeline
        env:
          YF_DISABLE_CURL_CFFI: "1"
        run: python pipeline/run_daily.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard/*.json
          if git diff --staged --quiet; then
            echo "No changes to dashboard data — skipping commit."
          else
            git commit -m "Daily dashboard update: $(date +'%Y-%m-%d')"
            git push
          fi

        